name: Build client EXE & server image
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name TcpSessionTester client/tcp_client.py
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TcpSessionTester.exe
          tag_name: build-${{ github.run_number }}
          name: TcpSessionTester build ${{ github.run_number }}
          generate_release_notes: false
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ghcr.io/panyong29/tcp-session-server:latest
